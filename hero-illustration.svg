<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice">
  <!-- Background gradient: brand colors -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#046380"/>
      <stop offset="60%" stop-color="#3D6F84"/>
      <stop offset="100%" stop-color="#5A8B9F"/>
   </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
   </linearGradient>
 </defs>

  <!-- Sky -->
  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- Sun / glow -->
  <circle cx="850" cy="380" r="40" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="850" cy="380" rx="180" ry="60" fill="url(#sunGlow)" opacity="0.4"/>

  <!-- Clouds: thin, minimal -->
  <g opacity="0.5" fill="#FFFFFF">
    <ellipse cx="200" cy="120" rx="60" ry="8"/>
    <ellipse cx="250" cy="135" rx="40" ry="6"/>
    <ellipse cx="600" cy="180" rx="80" ry="10"/>
    <ellipse cx="950" cy="100" rx="50" ry="7"/>
    <ellipse cx="1050" cy="160" rx="70" ry="9"/>
 </g>

  <!-- Horizon line -->
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>

  <!-- Mountains silhouette (very subtle) -->
  <path d="M 0 400 L 200 350 L 350 400 Z" fill="#FFFFFF" opacity="0.1"/>
  <path d="M 400 400 L 600 330 L 800 400 Z" fill="#FFFFFF" opacity="0.08"/>
  <path d="M 900 400 L 1100 360 L 1200 400 Z" fill="#FFFFFF" opacity="0.1"/>

  <!-- Plane (simple geometric) -->
  <g transform="translate(750, 200) rotate(-15)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="60" ry="10" fill="#FFFFFF"/>
    <!-- Tail -->
    <path d="M -55 -8 L -65 -22 L -50 -22 Z" fill="#FFFFFF"/>
    <!-- Wing -->
    <path d="M -10 8 L 30 22 L 35 18 L 5 5 Z" fill="#FFFFFF" opacity="0.95"/>
    <!-- Window dots -->
    <circle cx="20" cy="-1" r="2" fill="#046380"/>
    <circle cx="30" cy="-1" r="2" fill="#046380"/>
 </g>

  <!-- Trail -->
  <path d="M 200 250 Q 400 230 600 240 T 900 230" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="4 6"/>
</svg>
